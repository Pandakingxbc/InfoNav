defaults:
  - /benchmark/nav/objectnav:
      - objectnav_mp3d
  - _self_

habitat_baselines:
  evaluate: True
  force_torch_single_threaded: True

habitat:
  dataset:
    split: val
    data_path: data/datasets/objectnav/mp3d/v1/{split}/{split}.json.gz
  environment:
    max_episode_steps: 500
    iterator_options:
      cycle: false
      shuffle: false
      max_scene_repeat_steps: 10000000
  task:
    lab_sensors:
      gps_sensor:
        type: GPSSensor
        dimensionality: 3
    measurements:
      success:
        success_distance: 1.0
  simulator:
    habitat_sim_v0:
      allow_sliding: false
    forward_step_size: 0.25
    turn_angle: 30
    agents:
      main_agent:
        radius: 0.18
        sim_sensors:
          depth_sensor:
            min_depth: 0.0
            max_depth: 5.0
            normalize_depth: true

detector:
  # ============== Detection Mode Configuration ==============
  # Mode 1: YOLOv7 + GroundingDINO (ApexNav original, better false positive reduction)
  # Mode 2: D-FINE + GroundingDINO (current InfoNav, for comparison experiments)
  mode: 2  # Default: 2 (D-FINE + GroundingDINO)

  yolo:
    # YOLOv7 settings (Mode 1)
    confidence_threshold_yolo: 0.3
    iou_threshold_yolo: 0.45
    agnostic_nms: true

  dfine:
    # D-FINE threshold: set to tau_low (0.2) to allow Patience-Aware Navigation
    confidence_threshold_dfine: 0.4
    iou_threshold_dfine: 0.5
    agnostic_nms: true

  groundingDINO:
    # GroundingDINO threshold: set to tau_low (0.2) for same reason
    confidence_threshold_dino: 0.4
    text_threshold: 0.25

llm:
  llm_answer_path: llm/answers/llm_answer_mp3d.txt
  llm_response_path: llm/answers/llm_response_list.txt
  llm_client:
    llm_client: ollama # deepseek, ollama, or none
    ollama: 'qwen3:8b'
  # Hierarchical hypothesis level for ablation study (1-4)
  # L1: target_object only
  # L2: L1 + room_type
  # L3: L2 + co_occurrence
  # L4: L3 + object_part (Full)
  max_hierarchy_level: 4

# Exploration parameters (override ROS launch defaults for ablation study)
exploration:
  # Dual-Value Fusion: V_total = alpha * V_sem + (1-alpha) * V_ig
  # Set to 1.0 for pure semantic ablation (disable IG)
  fusion_alpha: 0.8
  use_ig_fusion: true

record_file_name: "record.txt"
continue_file_name: "continue.txt"
need_video: false
video_output_path: "videos/test_mp3d_{split}"
test_epi_num: -1

# ============================================================
# MP3D-specific Patience-Aware Navigation Thresholds
# ============================================================
# Lower thresholds to match ApexNav-style behavior (0.25~0.35 range)
# Formula: τ(t, obj) = tau_high - (t/T_max) × (tau_high - tau_low)
# ============================================================
patience_nav:
  T_max: 450
  min_detection_confidence: 0.2

  # Global fallback thresholds (unified low range like ApexNav)
  tau_high: 0.4
  tau_low: 0.2

  # Target-specific thresholds (all lowered for MP3D)
  threshold_by_size:
    # Large objects: bed, couch, sofa, bathtub, fireplace, gym equipment
    large:
      tau_high: 0.4
      tau_low: 0.2
    # Medium-large objects: tv, tv_monitor, counter, cabinet, shower, seating
    medium_large:
      tau_high: 0.4
      tau_low: 0.2
    # Medium objects: chair, sink, table, nightstand, stool
    medium:
      tau_high: 0.4
      tau_low: 0.2
    # Toilet: separate category
    toilet:
      tau_high: 0.4
      tau_low: 0.2
    # Small objects: plant, potted plant, pillow, towel, clothes
    small:
      tau_high: 0.4
      tau_low: 0.2